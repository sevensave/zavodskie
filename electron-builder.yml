appId: com.sevensave.zavodskie
productName: Zavodskie
copyright: © 2026 vldvr
directories:
  output: release
  buildResources: build
electronLanguages:
  - ru
  - en-US
files:
  - out/**
  - resources/**
  - package.json
extraMetadata:
  main: ./out/main/index.js
win:
  icon: build/icon.png
  executableName: Zavodskie
  # Лаунчер SevenSave ищет именно Zavodskie-<версия>-win-x64.zip, не переименовывать.
  artifactName: Zavodskie-${version}-win-${arch}.${ext}
  target:
    - target: zip
      arch: [x64]
mac:
  icon: build/icon.png
  category: public.app-category.simulation-games
  # Подписи Apple нет: подписываем ad-hoc, иначе на Apple Silicon macOS называет приложение повреждённым,
  # а лаунчер проверяет .app через codesign --verify --deep.
  identity: '-'
  hardenedRuntime: false
  # Лаунчер ищет Zavodskie-<версия>-mac-<arch>.zip (arm64 и x64), не переименовывать.
  artifactName: Zavodskie-${version}-mac-${arch}.${ext}
  target:
    - target: zip
      arch: [arm64, x64]
publish:
  provider: github
  owner: sevensave
  repo: zavodskie
  releaseType: draft
